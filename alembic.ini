# Alembic configuration for WiseDeck.
#
# The sqlalchemy.url here is only a fallback for manual CLI runs; the app
# always overrides it programmatically via wisedeck.database.alembic_runner
# (which reuses the resolved DATABASE_URL, including SQLite fallback).
# For manual runs against a non-default database:
#   DATABASE_URL=postgresql://... alembic upgrade head
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = src
sqlalchemy.url = sqlite:///./wisedeck.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
